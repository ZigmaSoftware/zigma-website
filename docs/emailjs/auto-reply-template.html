<div style="font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;margin:0;padding:0;">
  <div style="max-width:940px;margin:0 auto;background:#f3f3f3;">
    <div style="background:#2E7D32;color:#fff;padding:15px 16px;">
      <h2 style="margin:0;font-size:42px;line-height:1.15;font-weight:700;">Zigma Global Environ Solutions</h2>
    </div>

    <div style="padding:20px 22px 24px 22px;color:#000;">
      <h3 style="margin:0 0 14px 0;font-size:34px;line-height:1.2;font-weight:700;">Thank You for Contacting Us</h3>

      <p style="margin:0 0 10px 0;font-size:28px;line-height:1.4;">Dear {{name}},</p>
      <p style="margin:0 0 10px 0;font-size:28px;line-height:1.4;">We have received your request regarding <strong>{{subject}}</strong>.</p>
      <p style="margin:0 0 10px 0;font-size:28px;line-height:1.4;">Our team will get back to you shortly.</p>

      <hr style="border:0;border-top:1px solid #9e9e9e;margin:14px 0 14px 0;" />

      <p style="margin:0 0 8px 0;font-size:30px;line-height:1.35;"><strong>Your Message:</strong></p>
      <p style="margin:0 0 14px 0;font-size:28px;line-height:1.45;">{{message}}</p>

      <p style="margin:0;font-size:28px;line-height:1.45;">Regards,<br/>Zigma Team</p>
    </div>
  </div>
</div>
